name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PAYOS_CLIENT_ID: test_client_id
  PAYOS_API_KEY: test_api_key
  PAYOS_CHECKSUM_KEY: test_checksum_key
  CRON_SECRET: test_cron_secret
  ALLOW_DB_INTEGRATION_TESTS: "true"
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test_anon_key
  SUPABASE_SERVICE_ROLE_KEY: test_service_role_key

jobs:
  changes:
    name: Determine integration requirement
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.integration.outputs.required }}
      e2e_required: ${{ steps.e2e.outputs.required }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine integration requirement
        id: integration
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "reason=push-to-main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          if [[ -z "$base_sha" || -z "$head_sha" ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-pull-request-range" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          integration_pattern='^(__tests__/integration/|supabase/|app/actions/|app/api/|app/\(client\)/learn/.*/_components/(payment-|sticky-enroll-card\.tsx$)|utils/supabase/|lib/supabase/|lib/auth/|lib/schemas/|lib/discounts/|services/|middleware\.ts$|proxy\.ts$|types/database\.ts$|vitest\.integration\.config\.ts$|package\.json$|package-lock\.json$|\.github/workflows/|\.github/actions/)'

          if printf '%s\n' "$changed_files" | grep -E "$integration_pattern" > /dev/null; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "reason=integration-relevant-change" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-integration-relevant-change" >> "$GITHUB_OUTPUT"
          fi

      # E2E covers the whole app, so it is skipped only when every changed file is outside the running product.
      - name: Determine E2E requirement
        id: e2e
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          if [[ -z "$base_sha" || -z "$head_sha" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          non_product_pattern='^(docs/|\.agents/|\.claude/|__tests__/|AGENTS\.md$|CLAUDE\.md$|.*\.md$)'

          if printf '%s\n' "$changed_files" | grep -v -E "$non_product_pattern" | grep -q .; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Lint, agent skills and docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Lint
        run: npm run lint

      - name: Run agent skill validator tests
        run: node --test .agents/scripts/validate-skill.test.mjs

      - name: Run agent skill eval runner tests
        run: node --test .agents/scripts/run-skill-evals.test.mjs

      - name: Run agent skill CLI eval runner tests
        run: node --test .agents/scripts/run-skill-eval-cli.test.mjs

      - name: Run agent skill eval harness tests
        run: node --test .agents/scripts/run-skill-eval-harness.test.mjs

      - name: Validate repo-local agent skills
        run: node .agents/scripts/validate-skill.mjs

      - name: Validate agent skill evaluation suites
        run: node .agents/scripts/run-skill-evals.mjs validate --all

      - name: Run docs check tests
        run: node --test scripts/docs/check-structure.test.mjs scripts/docs/check-links.test.mjs

      - name: Check docs structure and links
        run: npm run docs:check

  unit:
    name: Unit, form and component tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Run unit, form, and component tests
        run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '!node_modules/**', '!.next/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build application
        run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.required == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,realtime,inbucket,edge-runtime,functions,analytics,vector,meta

      - name: Export local Supabase env
        shell: bash
        run: |
          supabase status -o env > supabase.env
          cat supabase.env >> "$GITHUB_ENV"
          source supabase.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY}"
          } >> "$GITHUB_ENV"

      - name: Run integration tests
        run: npm run test:integration -- --exclude __tests__/integration/learner-integrity.test.ts --exclude __tests__/integration/lf2-memory-check-answer-gate.test.ts --exclude __tests__/integration/lf2-learning-action-rpcs.test.ts --exclude __tests__/integration/lf3-content-read-boundary.test.ts --exclude __tests__/integration/lf3-memory-check-cards-seen-gate.test.ts --exclude __tests__/integration/ad7-admin-hardening.test.ts --exclude __tests__/integration/feat3-learning-activity.test.ts --exclude __tests__/integration/feat6-payment-history.test.ts --exclude __tests__/integration/tport1-teacher-course-portfolio.test.ts --exclude __tests__/integration/tov1-teacher-course-insights.test.ts

  learner-integrity:
    name: Learner integrity tests on isolated Supabase
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.required == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2

      - name: Run learner integrity tests on isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import { prepareSupabaseWorkdir } from './scripts/e2e/prepare-supabase-workdir.mjs'; prepareSupabaseWorkdir(process.cwd());"
          supabase --workdir .e2e-runtime start -x studio,imgproxy,realtime,inbucket,edge-runtime,functions,analytics,vector,meta > /dev/null
          supabase --workdir .e2e-runtime status -o env > .e2e-runtime/supabase.env
          source .e2e-runtime/supabase.env
          if [[ "$API_URL" != "http://127.0.0.1:45441" ]]; then
            echo "Learner integrity CI requires the isolated Supabase API on port 45441."
            exit 1
          fi
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY}}" \
          SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY}}" \
          E2E_SUPABASE_WORKDIR=.e2e-runtime \
          npm run test:integration -- __tests__/integration/learner-integrity.test.ts __tests__/integration/lf2-memory-check-answer-gate.test.ts __tests__/integration/lf2-learning-action-rpcs.test.ts __tests__/integration/lf3-content-read-boundary.test.ts __tests__/integration/lf3-memory-check-cards-seen-gate.test.ts __tests__/integration/ad7-admin-hardening.test.ts __tests__/integration/feat3-learning-activity.test.ts __tests__/integration/feat6-payment-history.test.ts __tests__/integration/tport1-teacher-course-portfolio.test.ts __tests__/integration/tov1-teacher-course-insights.test.ts

  e2e:
    name: E2E smoke tests on isolated Supabase (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.e2e_required == 'true'
    # Each shard gets its own runner and Supabase runtime; one shard's failure must not cancel the other's evidence.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # public.ecr.aws often rejects this job's image pulls with "Data limit exceeded"; job-level so `db reset` resolves the same images.
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup dependencies
        uses: ./.github/actions/setup-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # run-e2e.mjs reuses a running runtime, so start it here without the services the smoke suite does not use.
      - name: Start isolated Supabase
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import { prepareSupabaseWorkdir } from './scripts/e2e/prepare-supabase-workdir.mjs'; prepareSupabaseWorkdir(process.cwd());"
          npx supabase --workdir .e2e-runtime start -x studio,imgproxy,realtime,mailpit,edge-runtime,logflare,vector,postgres-meta > /dev/null

      # NEXT_PUBLIC_* values are inlined at build time, so build against the isolated runtime that the tests use.
      - name: Build application for E2E
        shell: bash
        run: |
          set -euo pipefail
          npx supabase --workdir .e2e-runtime status -o env > .e2e-runtime/supabase.env
          source .e2e-runtime/supabase.env
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          NEXT_DIST_DIR=.next-e2e \
          npm run build

      - name: Run E2E smoke tests
        run: npm run test:e2e:smoke -- --shard=${{ matrix.shard }}/2
        env:
          E2E_WEB_SERVER: start

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: test-results/e2e
          if-no-files-found: ignore

  production-gate:
    name: production-gate
    runs-on: ubuntu-latest
    needs: [changes, checks, unit, build, integration, learner-integrity, e2e]
    if: ${{ always() }}
    steps:
      - name: Require CI to pass
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for result in \
            "changes=${{ needs.changes.result }}" \
            "checks=${{ needs.checks.result }}" \
            "unit=${{ needs.unit.result }}" \
            "build=${{ needs.build.result }}"; do
            if [[ "${result#*=}" != "success" ]]; then
              echo "${result}"
              failed=1
            fi
          done

          # Integration jobs may be skipped only when the diff does not need them.
          if [[ "${{ needs.changes.outputs.required }}" == "true" ]]; then
            expected=success
          else
            expected=skipped
          fi
          for result in \
            "integration=${{ needs.integration.result }}" \
            "learner-integrity=${{ needs.learner-integrity.result }}"; do
            if [[ "${result#*=}" != "${expected}" ]]; then
              echo "${result} (expected ${expected})"
              failed=1
            fi
          done

          # E2E may be skipped only when the diff touches nothing but docs, agent rules and tests.
          if [[ "${{ needs.changes.outputs.e2e_required }}" == "true" ]]; then
            expected=success
          else
            expected=skipped
          fi
          if [[ "${{ needs.e2e.result }}" != "${expected}" ]]; then
            echo "e2e=${{ needs.e2e.result }} (expected ${expected})"
            failed=1
          fi

          exit "${failed}"
