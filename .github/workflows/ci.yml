name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    env:
      PAYOS_CLIENT_ID: test_client_id
      PAYOS_API_KEY: test_api_key
      PAYOS_CHECKSUM_KEY: test_checksum_key
      CRON_SECRET: test_cron_secret
      ALLOW_DB_INTEGRATION_TESTS: "true"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test_anon_key
      SUPABASE_SERVICE_ROLE_KEY: test_service_role_key

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.6.2

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run unit, form, and component tests
        run: npm run test:ci

      - name: Determine integration requirement
        id: integration
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "reason=push-to-main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          if [[ -z "$base_sha" || -z "$head_sha" ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-pull-request-range" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          integration_pattern='^(__tests__/integration/|supabase/|app/actions/|app/api/|app/\(client\)/learn/.*/_components/(payment-|sticky-enroll-card\.tsx$)|utils/supabase/|lib/supabase/|lib/auth/|lib/schemas/|lib/discounts/|services/|middleware\.ts$|proxy\.ts$|types/database\.ts$|vitest\.integration\.config\.ts$|package\.json$|package-lock\.json$|\.github/workflows/)'

          if printf '%s\n' "$changed_files" | grep -E "$integration_pattern" > /dev/null; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "reason=integration-relevant-change" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-integration-relevant-change" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.integration.outputs.required == 'true'
        uses: supabase/setup-cli@v2

      - name: Start local Supabase
        if: steps.integration.outputs.required == 'true'
        run: supabase start -x studio,imgproxy,realtime,inbucket,edge-runtime,functions,analytics,vector,meta

      - name: Export local Supabase env
        if: steps.integration.outputs.required == 'true'
        shell: bash
        run: |
          supabase status -o env > supabase.env
          cat supabase.env >> "$GITHUB_ENV"
          source supabase.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY}"
          } >> "$GITHUB_ENV"

      - name: Run integration tests
        if: steps.integration.outputs.required == 'true'
        run: npm run test:integration

      - name: Build application
        run: npm run build

  production-gate:
    name: production-gate
    runs-on: ubuntu-latest
    needs: [test-and-build]
    if: ${{ always() }}
    steps:
      - name: Require CI to pass
        shell: bash
        run: |
          if [[ "${{ needs.test-and-build.result }}" != "success" ]]; then
            echo "test-and-build result: ${{ needs.test-and-build.result }}"
            exit 1
          fi
