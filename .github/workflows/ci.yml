name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    env:
      PAYOS_CLIENT_ID: test_client_id
      PAYOS_API_KEY: test_api_key
      PAYOS_CHECKSUM_KEY: test_checksum_key
      CRON_SECRET: test_cron_secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: npx supabase start

      - name: Export local Supabase env
        shell: bash
        run: |
          npx supabase status -o env > supabase.env
          cat supabase.env >> "$GITHUB_ENV"
          source supabase.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY}"
          } >> "$GITHUB_ENV"

      - name: Reset local database
        run: npx supabase db reset

      - name: Run unit tests
        run: npm run test:ci

      - name: Run payment discount integration tests
        run: npm run test:integration:payment-discount

      - name: Build application
        run: npm run build