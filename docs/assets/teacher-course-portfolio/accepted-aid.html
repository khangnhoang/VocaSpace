    {id:"review-shopping",kind:"review",course:"conversation",title:"Mua sắm và thanh toán",label:"Chờ bạn duyệt",reason:"Bài học đã được gửi duyệt và đang chờ đánh giá.",time:"Hôm qua",action:"Xem bài gửi duyệt"},
    {id:"review-environment",kind:"review",course:"ielts",title:"Môi trường và phát triển bền vững",label:"Chờ bạn duyệt",reason:"Bài học đã được gửi duyệt và đang chờ đánh giá.",time:"Hôm nay",action:"Xem bài gửi duyệt"},
    {id:"fix-topic-office",kind:"correction",course:"office",title:"Sắp xếp lịch họp",label:"Bài học cần sửa",reason:"Làm rõ ngữ cảnh của câu hỏi luyện tập.",time:"Hôm nay",action:"Mở bài học"},
    {id:"review-direction",kind:"review",course:"conversation",title:"Hỏi đường trong thành phố",label:"Chờ bạn duyệt",reason:"Bài học đã được gửi duyệt và đang chờ đánh giá.",time:"Hôm nay",action:"Xem bài gửi duyệt"}
  ];
  const status = course => '<span class="tc-status ' + course.status + '">' + icon(course.status === "published" ? "circle-check" : course.status === "pending" ? "clock-3" : "file-pen-line") + ({draft:"Bản nháp",pending:"Chờ duyệt khóa học",published:"Đã xuất bản"}[course.status]) + '</span>';
  const metadata = course => '<div class="tc-meta"><span class="tc-role">' + course.role + '</span><span class="tc-dot">·</span>' + status(course) + '</div>';
  const save = () => {
    if (globalThis.openai?.setWidgetState) globalThis.openai.setWidgetState({modelContent:{scenario:options.scenario,attention:options.attention,invitations:options.invitations},privateContent:null}).catch(() => {});
  };
  function snapshot() {
    let courses = options.scenario === "Chưa có khóa học" ? [] : mockCourses.slice(0, options.scenario === "Nhiều khóa học" ? 8 : 3);
    if (options.scenario === "Chỉ xem") courses = courses.map(course => Object.assign({},course,{role:"Người xem"}));
    const work = options.scenario === "Chỉ xem" || !courses.length ? [] : mockWork.filter(item => courses.some(course => course.id === item.course));
    return {courses,work,canCreate:options.scenario !== "Chỉ xem"};
  }
  function row(course) {
    return '<article class="tc-course-row"><div class="tc-course-mark">' + icon("book-open") + '</div><div class="tc-course-info"><h3><button type="button" class="tc-course-title cursor-interaction" data-action="open" data-value="' + escape(course.title) + '">' + escape(course.title) + '</button></h3>' + metadata(course) + (course.rejection ? '<div class="tc-rejection">' + icon("message-square-warning") + '<span>Cần sửa thông tin để gửi duyệt lại</span></div>' : "") + '</div><div class="tc-row-actions">' + (course.role !== "Người xem" ? '<button type="button" class="tc-ghost cursor-interaction" aria-label="Tùy chọn ' + escape(course.title) + '" data-action="manage" data-value="' + escape(course.title) + '">' + icon("ellipsis") + '</button>' : "") + '<button type="button" class="tc-ghost cursor-interaction" aria-label="Mở ' + escape(course.title) + '" data-action="open" data-value="' + escape(course.title) + '">' + icon("arrow-up-right") + '</button></div></article>';
  }
  function feature(course) {
    return '<article class="tc-feature"><div class="tc-feature-head"><span class="tc-feature-label">' + icon("corner-down-right") + 'Tiếp tục biên soạn</span>' + (course.role !== "Người xem" ? '<button type="button" class="tc-ghost cursor-interaction" aria-label="Tùy chọn khóa học" data-action="manage" data-value="' + escape(course.title) + '">' + icon("ellipsis") + '</button>' : "") + '</div><h2>' + escape(course.title) + '</h2><p class="tc-description">' + escape(course.description) + '</p>' + metadata(course) + (options.attention && course.id === "conversation" && options.scenario !== "Chỉ xem" ? '<div class="tc-feature-context"><strong>Giới thiệu bản thân</strong><p>Có góp ý cần chỉnh sửa trước khi gửi duyệt lại.</p></div>' : "") + '<div class="tc-feature-bottom">' + button("Mở khóa học " + icon("arrow-right"),"open","tc-primary",course.title) + '<span class="tc-meta">Tổng quan & cấu trúc</span></div></article>';
  }
  function queue(work, state) {
    const items = work.filter(item => state.filter === "all" || item.kind === state.filter);
    const count = kind => work.filter(item => kind === "all" || item.kind === kind).length;
    const filters = [["all","Tất cả"],["review","Chờ duyệt"],["correction","Cần sửa"]].map(pair => '<button type="button" class="tc-filter cursor-interaction" data-filter="' + pair[0] + '" aria-pressed="' + (state.filter === pair[0]) + '">' + pair[1] + '<span>' + count(pair[0]) + '</span></button>').join("");
    const content = items.length ? items.map(item => {
      const course = mockCourses.find(course => course.id === item.course);
      return '<article class="tc-work ' + item.kind + '"><div class="tc-work-top"><span class="tc-work-kind">' + icon(item.kind === "review" ? "clipboard-check" : "message-square-warning") + escape(item.label) + '</span><span class="tc-time">' + item.time + '</span></div><h3>' + escape(item.title) + '</h3><p class="tc-work-course">' + escape(course.title) + '</p><p class="tc-work-reason">' + escape(item.reason) + '</p><button type="button" class="tc-link cursor-interaction" data-action="work" data-value="' + escape(item.title) + '">' + item.action + icon("arrow-right") + '</button></article>';
    }).join("") : '<div class="tc-queue-empty">' + icon("circle-check") + '<strong>Không có việc cần xử lý</strong><span>' + (work.length ? "Không có mục nào trong bộ lọc này." : "Bạn đã xem hết công việc thuộc quyền của mình.") + '</span></div>';
    return '<aside class="tc-attention"><div class="tc-section-head"><h2><span class="tc-attention-icon">' + icon("inbox") + '</span>Việc cần chú ý <span class="tc-total">' + work.length + '</span></h2></div><div class="tc-queue"><div class="tc-queue-filters" aria-label="Lọc việc cần chú ý">' + filters + '</div><div class="tc-queue-items" aria-label="Danh sách công việc">' + content + '</div><div class="tc-queue-foot"><span>' + items.length + ' / ' + work.length + ' công việc</span><span>' + (work.length > 2 ? "Cuộn để xem tiếp" : "Đã hiển thị toàn bộ") + '</span></div></div></aside>';
  }
  function renderWindow(windowElement) {
    const id = windowElement.dataset.layout;
    if (!local.has(id)) local.set(id,{filter:"all",search:"",status:"all",sort:"default"});
    const state = local.get(id);
    const data = snapshot();
    const dense = data.courses.length >= 5;
    windowElement.classList.toggle("tc-no-attention",!options.attention);
    let portfolio = "";
    if (options.scenario === "Đang tải") {
      portfolio = '<div class="tc-empty" role="status"><span class="tc-empty-icon">' + icon("loader-circle") + '</span><h2>Đang tải khóa học</h2><p>Đang lấy danh sách khóa học đang cộng tác.</p></div>';
    } else if (options.scenario === "Lỗi tải dữ liệu") {
      portfolio = '<div class="tc-empty" role="alert"><span class="tc-empty-icon">' + icon("cloud-off") + '</span><h2>Chưa tải được khóa học</h2><p>Danh sách khóa học hiện chưa sẵn sàng. Bạn có thể thử tải lại.</p>' + button("Thử lại","retry","tc-primary") + '</div>';
    } else if (!data.courses.length) {
      portfolio = '<div class="tc-empty"><span class="tc-empty-icon">' + icon("book-plus") + '</span><h2>Bắt đầu khóa học đầu tiên</h2><p>Tạo một khóa học để xây dựng nội dung, hoặc nhận lời mời cộng tác từ giáo viên khác.</p>' + button(icon("plus") + "Tạo khóa học","create","tc-primary") + '</div>';
    } else {
      if (dense) portfolio += '<div class="tc-list-tools"><label class="tc-search">' + icon("search") + '<span class="tc-sr">Tìm khóa học</span><input type="search" data-search placeholder="Tìm khóa học…" value="' + escape(state.search) + '"></label><select data-status aria-label="Lọc trạng thái"><option value="all">Mọi trạng thái</option><option value="draft">Bản nháp</option><option value="pending">Chờ duyệt</option><option value="published">Đã xuất bản</option></select><select data-sort aria-label="Sắp xếp khóa học"><option value="default">Tham gia gần đây</option><option value="name">Tên A–Z</option></select></div>';
      let courses = data.courses.filter(course => (state.status === "all" || course.status === state.status) && course.title.toLocaleLowerCase("vi").includes(state.search.toLocaleLowerCase("vi")));
      if (state.sort === "name") courses = courses.slice().sort((a,b) => a.title.localeCompare(b.title,"vi"));
      if (dense) portfolio += '<p class="tc-result-note">' + courses.length + ' khóa học</p>';
      if (!dense && id === "continuation") portfolio += feature(courses[0]) + '<div class="tc-other-list">' + courses.slice(1).map(row).join("") + '</div>';
      else portfolio += '<div class="tc-other-list">' + courses.map(row).join("") + (courses.length ? "" : '<div class="tc-empty"><p>Không có khóa học khớp tìm kiếm.</p></div>') + '</div>';
    }
    const invitation = options.invitations ? '<section class="tc-invitation" aria-label="Lời mời cộng tác">' + icon("mail") + '<div><strong>Lời mời cộng tác mới</strong><p>Mai Anh mời bạn làm biên tập viên · Tiếng Anh du lịch tự tin</p></div><div class="tc-invite-actions">' + button("Xem lời mời","invite","","Tiếng Anh du lịch tự tin") + '</div></section>' : "";
    windowElement.innerHTML = '<div class="tc-topbar"><button type="button" class="tc-back cursor-interaction" data-action="home">' + icon("arrow-left") + 'Trang chủ</button><span class="tc-preview-label">Bản xem thử · Dữ liệu giả</span></div><main class="tc-main"><header class="tc-page-heading"><div><p class="tc-eyebrow">Không gian giáo viên</p><h1>Khóa học của tôi</h1><p class="tc-intro">Tiếp nối nội dung bạn đang xây dựng.</p></div><div class="tc-utility"><div class="tc-counter">Khóa học đang cộng tác<strong>' + data.courses.length + ' khóa học</strong></div>' + (data.canCreate ? button(icon("plus") + "Tạo khóa học","create","tc-primary") : "") + '</div></header>' + invitation + '<div class="tc-layout"><section class="tc-portfolio" aria-label="Các khóa học đang cộng tác">' + portfolio + '</section>' + (options.attention && !["Đang tải","Lỗi tải dữ liệu"].includes(options.scenario) ? queue(data.work,state) : "") + '</div></main><div class="tc-toast" aria-live="polite" hidden></div>';
    const statusSelect = windowElement.querySelector("[data-status]");
    const sortSelect = windowElement.querySelector("[data-sort]");
    if (statusSelect) statusSelect.value = state.status;
    if (sortSelect) sortSelect.value = state.sort;
    windowElement.querySelectorAll("[data-filter]").forEach(control => control.addEventListener("click",() => { state.filter = control.dataset.filter; renderWindow(windowElement); refreshIcons(); }));
    const search = windowElement.querySelector("[data-search]");
    if (search) search.addEventListener("input",() => {
      const cursor = search.selectionStart;
      state.search = search.value;
      renderWindow(windowElement);
      const next = windowElement.querySelector("[data-search]");
      next.focus();
      if (cursor !== null && next.type !== "search") next.setSelectionRange(cursor,cursor);
      refreshIcons();
    });
    if (statusSelect) statusSelect.addEventListener("change",() => { state.status = statusSelect.value; renderWindow(windowElement); refreshIcons(); });
    if (sortSelect) sortSelect.addEventListener("change",() => { state.sort = sortSelect.value; renderWindow(windowElement); refreshIcons(); });
    windowElement.querySelectorAll("[data-action]").forEach(control => control.addEventListener("click",() => {
      const messages = {home:"Minh họa điều hướng về Trang chủ",create:"Minh họa: mở trang Tạo khóa học",open:"Minh họa: mở Tổng quan · ",work:"Minh họa: mở bài học · ",manage:"Minh họa: mở tùy chọn khóa học · ",invite:"Minh họa: mở lời mời · ",retry:"Minh họa: thử tải lại danh sách"};
      const notice = windowElement.querySelector(".tc-toast");
      notice.textContent = messages[control.dataset.action] + (control.dataset.value || "");
      notice.hidden = false;
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => { if (notice.isConnected) notice.hidden = true; },3500);
    }));
  }
  function refreshIcons() { if (globalThis.lucide) globalThis.lucide.createIcons({attrs:{width:16,height:16}}); }
  function render() {
    if (!scenes.includes(options.scenario)) options.scenario = defaults.scenario;
    root.querySelectorAll("[data-layout]").forEach(renderWindow);
    refreshIcons();
  }
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root,onChange:() => { local.clear(); render(); save(); }});
    tweak.addSelect(options,"scenario",{label:"Trạng thái dữ liệu",options:scenes});
    tweak.addToggle(options,"attention",{label:"Hiện việc cần chú ý"});
    tweak.addToggle(options,"invitations",{label:"Có lời mời cộng tác"});
  }
  globalThis.addEventListener("openai:set_globals",event => {
    const next = event.detail?.globals?.widgetState?.modelContent;
    if (!next) return;
    Object.assign(options,defaults,next);
    local.clear();
    render();
  });
})();
</script>
