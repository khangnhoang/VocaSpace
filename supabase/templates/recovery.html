<h2>Đặt lại mật khẩu VocaSpace</h2>
<p>Bạn vừa yêu cầu đặt lại mật khẩu cho tài khoản VocaSpace bằng email này.</p>
<p>Bấm vào link dưới đây để xác minh email và đặt mật khẩu mới:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery">Đặt lại mật khẩu</a></p>
<p>Nếu bạn không yêu cầu, hãy bỏ qua email này; mật khẩu hiện tại không đổi.</p>
